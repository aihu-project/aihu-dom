name: Release dependency gate

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package about to be published
        required: true
        type: choice
        options: [signals, reactive, arbor, dom]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run --filter "@aihu/${{ inputs.package }}" build
      - run: node scripts/verify-release-dependencies.mjs "${{ inputs.package }}"
      - run: bun run check:artifact
