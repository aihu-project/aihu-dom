name: Release dependency gate

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package about to be published
        required: true
        type: choice
        options: [signals, reactive, arbor, dom]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run --filter "@aihu/${{ inputs.package }}" build
      - run: node scripts/verify-release-dependencies.mjs "${{ inputs.package }}"
      - run: bun run check:artifact
